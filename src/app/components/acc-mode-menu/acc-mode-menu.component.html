<button type="button" class="mode-trigger" [matMenuTriggerFor]="modeMenu"
  aria-label="Mode" [attr.aria-description]="label()" title="Switch mode">
  <span class="mode-trigger-label">{{ label() }}</span>
  <mat-icon fontSet="material-symbols-outlined" class="mode-trigger-caret">arrow_drop_down</mat-icon>
</button>

<mat-menu #modeMenu="matMenu" xPosition="after" class="acc-mode-menu-panel">
  @for (m of modes; track m.id) {
    <button mat-menu-item type="button" role="menuitemradio"
      class="mode-option" [class.selected]="m.id === mode()"
      [attr.aria-checked]="m.id === mode()" (click)="pick(m.id)">
      <span class="mode-option-text">
        <span class="mode-option-label">{{ m.label }}</span>
        <span class="mode-option-description">{{ m.description }}</span>
      </span>
      @if (m.id === mode()) {
        <mat-icon fontSet="material-symbols-outlined" class="mode-option-check">check</mat-icon>
      }
    </button>
  }
</mat-menu>
