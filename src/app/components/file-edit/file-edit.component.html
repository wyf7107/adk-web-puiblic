@if (edit(); as fileEdit) {
  <div class="file-edit">
    <div class="file-edit-header">
      <mat-icon class="file-edit-icon">edit_note</mat-icon>
      <span class="file-edit-path" [title]="fileEdit.path">{{ fileEdit.path }}</span>
      <span class="file-edit-stats">
        <span class="file-edit-added-count">+{{ addedCount() }}</span>
        <span class="file-edit-removed-count">-{{ removedCount() }}</span>
      </span>
    </div>
    <div class="file-edit-body">
      <div class="diff-lines">
        @for (item of displayRows(); track $index) {
          @if (item.row.type === 'collapsed') {
            <button type="button" class="diff-collapsed" (click)="expandRow(item.index)">
              <mat-icon class="diff-collapsed-icon">unfold_more</mat-icon>
              {{ item.row.lines.length }} unchanged lines
            </button>
          } @else {
            <!-- Kept on one line: whitespace between the spans would show up in the diff. -->
            <div class="diff-line diff-{{ item.row.type }}"><span class="diff-marker">{{ markers[item.row.type] }}</span><span class="diff-text">{{ item.row.text }}</span></div>
          }
        }
      </div>
    </div>
  </div>
} @else if (error(); as editError) {
  <app-terminal-output [error]="editError"></app-terminal-output>
}
